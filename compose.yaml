services:
  db:
    ports:
      - "127.0.0.1:5433:5432"
    build:
      context: ./database
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cloudetl}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-cloudetl_admin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in the root .env file}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-cloudetl_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in the root .env file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in the root .env file}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost,http://127.0.0.1}
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-false}
      DJANGO_SESSION_COOKIE_SECURE: ${DJANGO_SESSION_COOKIE_SECURE:-false}
      DJANGO_CSRF_COOKIE_SECURE: ${DJANGO_CSRF_COOKIE_SECURE:-false}
      POSTGRES_DB: ${POSTGRES_DB:-cloudetl}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-cloudetl_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in the root .env file}
      DB_HOST: db
      DB_PORT: "5432"
      DB_SSLMODE: ${DB_SSLMODE:-prefer}
      DATASET_STORAGE_ROOT: /app/media
      DATASET_MAX_FILE_SIZE_BYTES: ${DATASET_MAX_FILE_SIZE_BYTES:-26214400}
    volumes:
      - dataset_files:/app/media
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      - backend

volumes:
  postgres_data:
  dataset_files:
